<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | SpendWise</title>
  <meta name="theme-color" content="#167a55">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <h2>₹ SpendWise</h2>
      <p>Smart Expense Tracker</p>
    </div>

    <nav class="sidebar-nav" aria-label="Main navigation">
      <a href="index.html" class="nav-link">
        <span>▦</span> Dashboard
      </a>

      <a href="expenses.html" class="nav-link">
        <span>▤</span> Expenses
      </a>

      <a href="budget.html" class="nav-link">
        <span>◉</span> Budget
      </a>

      <a href="bills.html" class="nav-link">
        <span>▣</span> Bills &amp; Payments
      </a>

      <a href="savings.html" class="nav-link">
        <span>◆</span> Savings &amp; Investments
      </a>
    </nav>

    <div class="sidebar-bottom">
      <a href="profile.html" class="nav-link active" aria-current="page">
        <span>👤</span> My Profile
      </a>

      <button id="sidebarLogoutButton" type="button" class="sidebar-logout">
        Log Out
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <button class="sidebar-toggle" id="sidebarToggle"
      type="button" aria-label="Open navigation"
      aria-expanded="false">
      ☰
    </button>

    <header class="topbar">
      <div>
        <h1>My Profile</h1>
        <p>Manage your SpendWise account.</p>
      </div>
      <a href="profile.html" class="top-profile active" aria-label="My Profile">
        <span class="avatar" aria-hidden="true">👤</span>
        <span>My Profile</span>
      </a>
    </header>

    <section class="profile-content">
      <div class="profile-card">
        <h2>Account Details</h2>

        <div class="profile-detail">
          <strong>Name</strong>
          <span id="profileName">Loading...</span>
        </div>

        <div class="profile-detail">
          <strong>Email</strong>
          <span id="profileEmail">Loading...</span>
        </div>

        <div class="profile-actions">
          <button id="backButton" type="button" class="page-button">
            Back to Dashboard
          </button>

          <button id="logoutButton" type="button">
            Log Out
          </button>
        </div>

        <p id="profileMessage" role="status"></p>
      </div>
    </section>

    <footer class="footer">
      © 2026 SpendWise. Manage your money wisely.
    </footer>
  </main>
</div>

<script src="ui.js"></script>
<script src="nav.js"></script>
<script type="module" src="profile.js"></script>
</body>
</html>
