<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="spendwiseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#198754" />
      <stop offset="100%" stop-color="#0f5132" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#spendwiseGrad)" filter="url(#shadow)" />
  <!-- Circle accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#25a26a" stroke-width="8" opacity="0.4" />
  <!-- Rupee Symbol -->
  <text x="256" y="330" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="260" font-weight="800" fill="#ffffff" text-anchor="middle">₹</text>
  <!-- Sparkle / Star accent -->
  <circle cx="370" cy="140" r="14" fill="#a3e635" />
</svg>
