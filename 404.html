<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | SpendWise</title>
  <meta name="theme-color" content="#167a55">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="style.css?v=2.0">
  <style>
    .not-found-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: var(--background);
    }
    .not-found-card {
      background: var(--white);
      padding: 48px 36px;
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      max-width: 480px;
      width: 100%;
    }
    .not-found-icon {
      font-size: 64px;
      margin-bottom: 16px;
      display: inline-block;
    }
    .not-found-card h1 {
      font-size: 28px;
      color: var(--primary);
      margin: 0 0 12px;
    }
    .not-found-card p {
      color: var(--muted);
      margin: 0 0 28px;
      font-size: 15px;
      line-height: 1.5;
    }
    .not-found-card .page-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      padding: 12px 24px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="not-found-container">
    <div class="not-found-card">
      <span class="not-found-icon" aria-hidden="true">🧭</span>
      <h1>404 — Page Not Found</h1>
      <p>The page you are looking for doesn't exist or has been moved. Let's get you back on track with your finances.</p>
      <a href="index.html" class="page-button">
        ← Back to Dashboard
      </a>
    </div>
  </div>
</body>
</html>
