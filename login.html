<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | SpendWise</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="auth-container">
    <section class="auth-card">
      <a class="brand" href="login.html">₹ SpendWise</a>
      <p class="subtitle">Your money, your control.</p>

      <div class="auth-tabs">
        <button type="button" id="loginTab" class="active">Login</button>
        <button type="button" id="registerTab">Register</button>
      </div>

      <h1 id="formTitle">Welcome back!</h1>
      <p id="formDescription">Log in to access your dashboard.</p>

      <form id="authForm">
        <div id="nameGroup" hidden>
          <label for="displayName">Full name</label>
          <input
            id="displayName"
            type="text"
            autocomplete="name"
            placeholder="Enter your name"
          >
        </div>

        <label for="email">Email address</label>
        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          minlength="6"
          placeholder="At least 6 characters"
          required
        >

        <button type="submit" id="submitButton">Login</button>
      </form>

      <button type="button" id="forgotPassword" class="text-button">
        Forgot password?
      </button>

      <p id="authMessage" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script type="module" src="auth.js"></script>
</body>
</html>
